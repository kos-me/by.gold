# The gold.by worker: static site + /api/* + the scheduled source checks.
#
# NO SECRET BELONGS HERE, EVER. Anything secret goes in via
# `wrangler secret put` — the full list is in DEPLOY.md.
#
# The KV namespace ids are filled in after `wrangler kv namespace create`.
# They are not secrets, but before the first deploy there is nothing to put
# there: they are left empty on purpose so `wrangler deploy` fails rather
# than creating something unintended.

name = "gold-by"
main = "worker/src/index.ts"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]

# The built site. `npm run build` puts it in dist/.
[assets]
directory = "./dist"
binding = "ASSETS"
# Extension-less paths (/o-proekte) are served from /o-proekte.html
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[vars]
ENVIRONMENT = "production"

# Per-decree report counters, the last-check stamp, the publish-block flag.
[[kv_namespaces]]
binding = "REPORTS"
id = ""

# Rate-limit counters. Hashed addresses only, one-hour TTL.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = ""

# Check schedule.
#   Minfin — hourly: the mockup promises an hourly check.
#   NBRB   — daily: bullion updates once a day.
[triggers]
crons = ["7 * * * *", "20 6 * * *"]

[observability]
enabled = true

[env.staging]
name = "gold-by-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
