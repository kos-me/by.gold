# The gold.by worker: static site + /api/* + the scheduled source checks.
#
# NO SECRET BELONGS HERE, EVER. Anything secret goes in via
# `wrangler secret put` — the full list is in DEPLOY.md.
#
# The KV namespace ids are filled in after `wrangler kv namespace create`.
# They are not secrets, but before the first deploy there is nothing to put
# there: they are left empty on purpose so `wrangler deploy` fails rather
# than creating something unintended.

name = "gold-by"
main = "worker/src/index.ts"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]

# No workers.dev URL. Three reasons, in order of weight.
#
# 1. The subdomain is an ACCOUNT-level name, shared with every other project in
#    this account. Registering one to get a test URL for gold.by would name it
#    for everything else too, and changing it later rewrites every Worker URL in
#    the account. That decision is not this project's to make.
# 2. A workers.dev copy would be a second publicly indexable origin serving the
#    same pages. For a site whose entire purpose is to be the authoritative
#    place to read an official figure, a duplicate is worth avoiding.
# 3. The real Worker can be exercised without it: `wrangler dev --remote` runs
#    it on Cloudflare, against the real KV namespaces, reachable only locally.
#
# Set here rather than only in the dashboard on purpose. Cloudflare's docs: "If
# you disable your workers.dev route in the Cloudflare dashboard but do not
# update your Worker's Wrangler file with workers_dev = false, the workers.dev
# route will be re-enabled the next time you deploy."
#
# The site becomes reachable when gold.by is attached as a Custom Domain, which
# writes a record in that zone and nowhere else. Never a wildcard route: a
# pattern like */* would capture traffic for the other domains here.
#
# MUST STAY ABOVE THE FIRST [table] HEADER. In TOML every key after a header
# belongs to that table, so placing this after [assets] silently made it
# assets.workers_dev — "Unexpected fields found in assets field" — and the
# subdomain prompt came back.
workers_dev = false

# The built site. `npm run build` puts it in dist/.
[assets]
directory = "./dist"
binding = "ASSETS"
# Extension-less paths (/o-proekte) are served from /o-proekte.html
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[vars]
ENVIRONMENT = "production"

# KV. Created 30 July 2026 in the `onestar` account, which held no namespaces
# before these two, so nothing was overwritten. Namespace ids are not secrets —
# they identify storage and grant no access on their own.
#
# These entries once carried `id = ""` so that `wrangler deploy` would fail
# rather than deploy something half-configured. That was too blunt: an invalid id
# fails *every* wrangler command reading this file, `login` included, so it
# blocked the setup it was guarding. The guarantee lives in the worker instead —
# in production the form returns 503 when the RATE_LIMIT binding is missing,
# rather than quietly accepting an unlimited number. See contact.ts.

# Per-decree report counters, the last-check stamp, the publish-block flag.
[[kv_namespaces]]
binding = "REPORTS"
id = "229cb5d0d5784d879e331983d6719116"

# Rate-limit counters. Hashed addresses only, one-hour TTL.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "7e4390cb7002477a9d3cd9e5d0e2719c"

# Check schedule.
#   Minfin — hourly: the mockup promises an hourly check.
#   NBRB   — daily: bullion updates once a day.
[triggers]
crons = ["7 * * * *", "20 6 * * *"]

[observability]
enabled = true

[env.staging]
name = "gold-by-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
