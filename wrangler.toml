# The gold.by worker: static site + /api/* + the scheduled source checks.
#
# NO SECRET BELONGS HERE, EVER. Anything secret goes in via
# `wrangler secret put` — the full list is in DEPLOY.md.
#
# The KV namespace ids are filled in after `wrangler kv namespace create`.
# They are not secrets, but before the first deploy there is nothing to put
# there: they are left empty on purpose so `wrangler deploy` fails rather
# than creating something unintended.

name = "gold-by"
main = "worker/src/index.ts"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]

# The built site. `npm run build` puts it in dist/.
[assets]
directory = "./dist"
binding = "ASSETS"
# Extension-less paths (/o-proekte) are served from /o-proekte.html
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[vars]
ENVIRONMENT = "production"

# KV — commented out until the namespaces exist.
#
# These were previously left with `id = ""` so that `wrangler deploy` would fail
# rather than deploy something half-configured. That turned out to be too blunt:
# an invalid id fails *every* wrangler command that reads this file, including
# `wrangler login` and `wrangler kv namespace create`, so it blocked the very
# setup it was guarding. Commented out instead.
#
# The intent is preserved in the worker rather than here: in production the form
# refuses a submission when the RATE_LIMIT binding is missing, with a 503 and a
# message, instead of quietly accepting an unlimited number. See contact.ts.
#
# To enable, run:
#   npx wrangler@4 kv namespace create REPORTS
#   npx wrangler@4 kv namespace create RATE_LIMIT
# then uncomment these blocks and paste in the ids it prints.

# Per-decree report counters, the last-check stamp, the publish-block flag.
# [[kv_namespaces]]
# binding = "REPORTS"
# id = "paste the id here"

# Rate-limit counters. Hashed addresses only, one-hour TTL.
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "paste the id here"

# Check schedule.
#   Minfin — hourly: the mockup promises an hourly check.
#   NBRB   — daily: bullion updates once a day.
[triggers]
crons = ["7 * * * *", "20 6 * * *"]

[observability]
enabled = true

[env.staging]
name = "gold-by-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
