<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Клеймо: слегка повёрнутый штампик — тот же знак, что стоит у цифры
    с номером постановления. Ничего золотого и блестящего: материал
    предмета — сталь и краска, а не блеск.
  -->
  <rect width="32" height="32" rx="6" fill="#1b1e21"/>
  <g transform="rotate(-1.8 16 16)">
    <rect x="6.5" y="8.5" width="19" height="15" rx="2.5"
          fill="none" stroke="#8b9299" stroke-width="1.6"/>
    <text x="16" y="19.8" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="11" font-weight="700" fill="#f5f4f1">g</text>
  </g>
</svg>
