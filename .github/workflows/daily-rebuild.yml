# Rebuilds and redeploys the site on a schedule.
#
# WHY THIS EXISTS. The site is static: a page is a snapshot of what was true
# when it was built. But the state depends on today's date — an act's end date
# passing withholds the figure, and a future-dated act's start date arriving
# should show a new one. Neither happens without a build. A build left alone
# past its act's end date goes quiet (the browser guard takes the figure away)
# but it cannot show a successor that is already sitting in data/tariffs.json.
# See UPDATING.md, "The rebuild is the part people forget".
#
# WHAT IT PUBLISHES. Nothing new. It rebuilds the commit already on main and
# redeploys it, so the only thing that changes is which date the pages were
# rendered for. It cannot introduce a figure: figures enter only through a
# person merging a pull request into data/tariffs.json.
#
# It refuses to deploy a build that does not pass npm run check.

name: Daily rebuild

on:
  schedule:
    # Times are UTC. Minsk is UTC+3 all year — Belarus has no DST.
    - cron: '5 21 * * *' # 00:05 Minsk: an act taking force today goes live at once
    - cron: '5 06 * * *' # 09:05 Minsk: safety net, GitHub's schedules are best-effort
  workflow_dispatch: # the manual button, for when you want it now

# Never let two deploys overlap.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22' # package.json engines: >=22.12.0
          cache: npm

      - run: npm ci

      # Types, 234 tests, and a build. A scheduled job must not be able to
      # push out something broken while nobody is watching.
      - name: Check
        run: npm run check

      # These are not secrets — they ship in the HTML — so they live in
      # repository *variables*, not secrets. Unset is a legal state: no
      # Turnstile widget, no analytics. It is not a legal state in production,
      # where the worker rejects a form submission that arrives without a
      # Turnstile token, so set at least PUBLIC_TURNSTILE_SITE_KEY.
      - name: Build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
          PUBLIC_YANDEX_VERIFICATION: ${{ vars.PUBLIC_YANDEX_VERIFICATION }}
        run: npm run build

      # Report what state was just published, so the run log answers "what did
      # the site look like that day?" without anyone having to guess.
      - name: What was published
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const records = JSON.parse(readFileSync("data/tariffs.json", "utf8"));
            const today = new Date(Date.now() + 180 * 60000).toISOString().slice(0, 10);
            const governing = records.filter((r) => r.transcribed_from !== "archive");
            const live = governing.filter((r) => r.effective_from <= today).at(-1) ?? null;
            const next = governing.find((r) => r.effective_from > today) ?? null;
            console.log(`Minsk date: ${today}`);
            console.log(live === null
              ? "no act in force — the figure is withheld"
              : `act № ${live.act_number} of ${live.act_date}, in force from ${live.effective_from}, expiry ${live.stated_expiry ?? "not stated"}`);
            if (live?.stated_expiry !== null && live?.stated_expiry !== undefined && live.stated_expiry < today)
              console.log("WARNING: the act in force has lapsed and no successor is present");
            if (next !== null) console.log(`next: № ${next.act_number} from ${next.effective_from}`);
          '

      # wrangler.toml sets [assets] directory = "./dist", so this ships the
      # build that was just made along with the worker.
      #
      # Pinned to a major on purpose. Once you have a first successful deploy,
      # consider adding wrangler to devDependencies so CI and your machine use
      # exactly the same version.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
